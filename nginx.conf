server {
    listen 80;
    server_name api.example.com;

    location /api/export/ {
        proxy_pass http://localhost:8080;

        # Cấu hình timeout tăng lên 120 giây
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # (Tùy chọn bổ sung) Cấu hình timeout gửi dữ liệu về client
        send_timeout 120s;
    }
}
